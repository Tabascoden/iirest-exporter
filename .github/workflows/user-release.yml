name: User release package

on:
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build user package
        run: npm run release:user

      - name: Upload user package
        uses: actions/upload-artifact@v4
        with:
          name: PriceParse-user-package
          path: .output/user-release/PriceParse-*.zip
          if-no-files-found: error
