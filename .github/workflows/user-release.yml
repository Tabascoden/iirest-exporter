name: User release folder

on:
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build user folder
        run: npm run release:user

      - name: Upload user folder
        uses: actions/upload-artifact@v4
        with:
          name: iiRest-Exporter-user-folder
          path: FOR_USER/iiRest Exporter-*
          if-no-files-found: error
